name: pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown

      - name: Trunk
        run: |
          curl -fsSL -o trunk.tar.gz https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf trunk.tar.gz
          install -m 755 trunk /usr/local/bin/trunk
          trunk --version

      - name: Build
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_path }}
        run: |
          base="${PUBLIC_URL:-/}"
          case "$base" in
            */) ;;
            *) base="$base/" ;;
          esac
          trunk build --release --public-url "$base"
          mkdir -p dist/cronos
          cp dist/index.html dist/cronos/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
